<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Mobile Detailing | Mobile Car Detailing in Northern Virginia &amp; the DMV</title>
    <meta
      name="description"
      content="Mobile car detailing that comes to your home or office in Fairfax, Arlington, Alexandria, Bethesda and across the DMV. Interior, exterior, full details and ceramic coatings."
    />
    <meta name="theme-color" content="#0F2A1F" />
    <script>document.documentElement.classList.add('js')</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!--
      Static copy of the contact form so Netlify's build bot can detect it.
      Field names must match src/components/ContactForm.jsx exactly.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="vehicle" />
      <select name="service"><option value="">-</option></select>
      <input type="date" name="date" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
