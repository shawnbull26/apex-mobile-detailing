[build]
  command = "npm run build"
  publish = "dist"

# Every route is prerendered to its own index.html (see scripts/prerender.js),
# and unknown paths fall through to the prerendered 404.html automatically.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
